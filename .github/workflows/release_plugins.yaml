name: Release Plugins
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (DRY RUN, no push or publish).'
        required: true
        default: 'v0.0.0'

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  set-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tag to be on main
        run: |
          set -euo pipefail
          # This runs on a TAG push, so GITHUB_REF is refs/tags/vX.Y.Z and never
          # "main". What matters is that the tagged commit is reachable from
          # main, otherwise a release is cut from untested code.
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "FAIL: ${GITHUB_SHA} (${GITHUB_REF}) is not reachable from main. Refusing to release untested code."
            exit 1
          fi

      - name: Install Node.js and pnpm
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          install: false

      - name: Get version from tag
        id: get_version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="${VERSION%%-*}"  # Remove everything after '-'
            VERSION="${VERSION%%.*}"  # Remove everything after first '.'
          fi
          echo "Extracted version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set package version
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          MANIFEST="streamdeck/com.tim0-12432.opencode-traffic-lights.sdPlugin/manifest.json"

          pnpm version "$VERSION" -r --no-git-tag-version --no-git-checks

          # Manifest Version is 4-part (major.minor.patch.build); build stays 0.
          sed -i "0,/\"Version\":/s|\"Version\": \"[^\"]*\"|\"Version\": \"${VERSION}.0\"|" "$MANIFEST"
          # The top-level key must match exactly; -x rejects the nested Nodejs.Version.
          grep -qx "$(printf '\t"Version": "%s.0",' "$VERSION")" "$MANIFEST"

      - name: Show the changed files
        if: ${{ env.DRY_RUN }}
        run: |
          set -euo pipefail
          git status --short
          git diff --stat

      - name: Commit version changes
        if: ${{ !env.DRY_RUN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          git config user.name "GitHub Actions"
          git config user.email "noreply.github@github.local"
          git add package.json opencode/package.json streamdeck/package.json streamdeck/com.tim0-12432.opencode-traffic-lights.sdPlugin/manifest.json
          if git diff --cached --quiet; then
            echo "Nothing to commit: the manifests already carried ${TAG#v}"
          else
            git commit -m "Set version to ${{ steps.get_version.outputs.version }}"
            git push origin HEAD:main
          fi
          # --force: the tag was pushed before this job, so it still points at the
          # old commit and has to be moved, not created.
          git tag -f "$TAG" -m "Release version ${{ steps.get_version.outputs.version }}"
          git push origin "refs/tags/$TAG" --force

  verify:
    runs-on: ubuntu-latest
    needs: set-version
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Install Node.js and pnpm
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          install: false

      - name: Install dependencies
        run: pnpm ci

      - name: Run typechecking
        run: pnpm tsc

      - name: Run tests
        run: pnpm test

  build-opencode:
    runs-on: ubuntu-latest
    needs:
      - set-version
      - verify
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Install Node.js and pnpm
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          install: false

      - name: Install dependencies
        run: pnpm ci

      - name: Build package
        run: pnpm --filter=opencode build

      - name: Publish package to NPM
        if: ${{ !env.DRY_RUN }}
        run: pnpm --filter=opencode publish --provenance --access public --no-git-checks

  build-streamdeck:
    runs-on: ubuntu-latest
    needs:
      - set-version
      - verify
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Install Node.js and pnpm
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          install: false

      - name: Install dependencies
        run: pnpm ci

      - name: Build package
        run: pnpm --filter=streamdeck build

      - name: Validate the manifest
        run: pnpm --filter=streamdeck validate

      - name: Pack the .sdPlugin distributable
        run: pnpm --filter=streamdeck exec streamdeck pack com.tim0-12432.opencode-traffic-lights.sdPlugin --output . --force

      - name: Show the packed bundle
        run: ls -l streamdeck/*.streamDeckPlugin

      - name: Upload the .streamDeckPlugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: sdplugin-bundle
          path: streamdeck/*.streamDeckPlugin
          if-no-files-found: error
          retention-days: 30

  create-release:
    runs-on: ubuntu-latest
    needs:
      - build-opencode
      - build-streamdeck
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Download the .streamDeckPlugin bundle
        uses: actions/download-artifact@v4
        with:
          name: sdplugin-bundle
          path: release-assets

      - name: Get version from package
        id: get_version
        run: |
          VERSION="$(jq -r '.version' package.json)"
          echo "Extracted version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Release package
        if: ${{ !env.DRY_RUN }}
        uses: softprops/action-gh-release@v3
        with:
          body: |
            ## OpenCode plugin

            Add the OpenCode plugin to your project with:

            ```bash
            opencode plugin add @tim0-12432/opencode-traffic-lights-opencode
            ```

            or download the plugin directly and point OpenCode to it:

            ```json
            {
              "$schema": "https://opencode.ai/config.json",
              "plugin": [
                "C:/absolute/path/to/opencode-traffic-lights/opencode/src/plugin/index.ts"
              ]
            }
            ```

            ## Stream Deck plugin

            Download and open `com.tim0-12432.opencode-traffic-lights.streamDeckPlugin`
            from the assets below, or install it from the official marketplace:

            - https://marketplace.elgato.com/product/opencode-traffic-lights-streamdeck-65b13b96-043e-4fd7-9cc6-78360a6a648c

          files: release-assets/*.streamDeckPlugin
          generate_release_notes: true
          make_latest: true
